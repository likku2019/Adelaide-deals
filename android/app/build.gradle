plugins { id 'com.android.application' }

android {
  namespace 'au.adelaide.dealsheet'
  compileSdk 35
  defaultConfig {
    applicationId "au.adelaide.dealsheet"
    minSdk 24
    targetSdk 35
    versionCode 3
    versionName "1.2"
  }
  signingConfigs {
    release {
      storeFile file("release.jks")
      storePassword "dealsheet2026"
      keyAlias "dealsheet"
      keyPassword "dealsheet2026"
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
