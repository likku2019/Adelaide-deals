name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed APK
        id: build
        run: gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Publish APK to the website
        if: success()
        run: |
          mkdir -p app
          cp android/app/build/outputs/apk/release/app-release.apk app/deal-sheet.apk
          rm -f app/build-log.txt
          git config user.name "likku2019"
          git config user.email "likku2019@users.noreply.github.com"
          git add app/
          git commit -m "Update Android app (build ${GITHUB_RUN_NUMBER})" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save build log on failure
        if: failure()
        run: |
          mkdir -p app
          tail -n 200 build-log.txt > app/build-log.txt || echo "no log" > app/build-log.txt
          git config user.name "likku2019"
          git config user.email "likku2019@users.noreply.github.com"
          git add app/build-log.txt
          git commit -m "Android build ${GITHUB_RUN_NUMBER} failed: log" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
